name: A site looks wrong
description: Text you can't read, a light area left over, or something broken on one site.
labels: ["broken site"]
# Text fields, not a dropdown, so a link can prefill them by field `id` if ever needed:
# https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/creating-an-issue#creating-an-issue-from-a-url-query
body:
  - type: markdown
    attributes:
      value: This issue is public. Check that the fields below contain nothing you don't want to share.
  - type: input
    id: host
    attributes:
      label: Site
      description: The host name only, for example example.com. Don't paste full addresses that contain personal information.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Duskling settings on this site
      placeholder: "Mode: full · Theme: dark · Site's own dark theme: none"
  - type: textarea
    id: what
    attributes:
      label: What looks wrong
      description: A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Duskling and iOS versions
      placeholder: Duskling 1.0.1 · iOS 27.2 · iPhone
