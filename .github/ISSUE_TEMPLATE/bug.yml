name: Bug
description: Something in the app or the Safari extension doesn't work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Duskling and iOS versions
      placeholder: Duskling 1.0, iOS 27.2, iPhone
