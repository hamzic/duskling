# Keeps the SHA-pinned actions current. Dependabot updates a SHA pin when the version comment is on the same line
# (https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Dev tooling only (package.json has no runtime dependencies); one grouped PR a month.
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: monthly
    groups:
      dev-tooling:
        patterns: ["*"]
