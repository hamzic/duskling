name: extension

on:
  push:
    paths: ["extension/**", "shared/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extension/**", "shared/**", ".github/workflows/extension.yml"]

# Security (https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions):
# read-only GITHUB_TOKEN, actions pinned to full commit SHAs (tag in the comment), checkout keeps no git credentials,
# and `pull_request` only (never `pull_request_target`). Fork PRs need a maintainer's approval before they run
# (repository setting, see https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-workflow-runs/approving-workflow-runs-from-public-forks).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS, not Linux: Playwright's macOS WebKit is the closest to Safari, which is what ships.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version named in extension/package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run size
      - run: pnpm exec playwright install webkit
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: extension/test-results/
          if-no-files-found: ignore
