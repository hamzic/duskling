name: settingskit

on:
  push:
    paths: ["apple/Packages/SettingsKit/**", "shared/**", ".github/workflows/settingskit.yml"]
  pull_request:
    paths: ["apple/Packages/SettingsKit/**", "shared/**", ".github/workflows/settingskit.yml"]

# Security: see the comment in extension.yml.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS with the same Xcode as the app build, since SettingsKit only ships inside the Apple app.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - run: swift test --package-path apple/Packages/SettingsKit
