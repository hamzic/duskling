# XcodeGen spec. Keys per XcodeGen 2.46.0 Docs/ProjectSpec.md:
# https://github.com/yonaskolb/XcodeGen/blob/2.46.0/Docs/ProjectSpec.md
name: Dusk
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    # Build Settings Reference: "If enabled, the build system will sandbox user scripts to disallow undeclared
    # input/output dependencies." https://developer.apple.com/documentation/xcode/build-settings-reference 
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SettingsKit:
    path: Packages/SettingsKit
targets:
  Dusk:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Dusk.debug.entitlements", "Dusk.personal.entitlements"]
      # Shown by the Licenses screen.
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DuskAppGroupID: $(APP_GROUP_ID)
        DuskReportEmail: $(REPORT_EMAIL)
        DuskRepoURL: $(REPO_URL)
        UILaunchScreen: {}
        # The Xcode app template's orientations. iPad apps that support multitasking must list all four
        # (https://developer.apple.com/documentation/bundleresources/information-property-list/uisupportedinterfaceorientations).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    # App/Dusk.entitlements is hand-maintained (XcodeGen's `entitlements:` would override the Debug setting below).
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/Dusk.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Build Settings Reference: SWIFT_EMIT_LOC_STRINGS "When enabled, the Swift compiler will be used to extract
        # Swift string literal and interpolation LocalizedStringKey and LocalizationKey types"; with
        # LOCALIZATION_PREFERS_STRING_CATALOGS "string tables generated in a localization export will prefer the String
        # Catalog format". The build compiles App/Localizable.xcstrings into the app's en.lproj (LocalizationTests).
        # https://developer.apple.com/documentation/xcode/build-settings-reference
        # https://developer.apple.com/documentation/xcode/localizing-and-varying-text-with-a-string-catalog
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # Debug adds get-task-allow (see Dusk.debug.entitlements); Release keeps Dusk.entitlements.
        # DUSK_APP_ENTITLEMENTS defaults to App/Dusk.debug.entitlements (Base.xcconfig); a free personal team sets it to
        # App/Dusk.personal.entitlements in Signing.local.xcconfig (no iCloud key-value storage there).
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(DUSK_APP_ENTITLEMENTS)
    dependencies:
      - target: DuskExtension
        embed: true
      - package: SettingsKit
  DuskExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
        excludes: ["Resources", "Resources/**", "Info.plist", "DuskExtension.entitlements"]
      # Web extension files must land at the .appex root with their subdirectories intact. A single folder
      # reference to Extension/Resources would copy a directory named "Resources" into the bundle root, which
      # makes the build fail in ValidateEmbeddedBinary ("Couldn't load Info dictionary"; reproduced in
      # this project). So: top-level files as a group (copied flat to the root) and
      # each subdirectory as its own folder reference. build-extension.sh fails if dist/ gains a subdirectory
      # that isn't listed here.
      - path: Extension/Resources
        excludes: ["_locales", "_locales/**", "boot", "boot/**", "icons", "icons/**", "popup", "popup/**", "prepaint", "prepaint/**"]
        buildPhase: resources
      - path: Extension/Resources/_locales
        type: folder
        buildPhase: resources
      - path: Extension/Resources/boot
        type: folder
        buildPhase: resources
      - path: Extension/Resources/icons
        type: folder
        buildPhase: resources
      - path: Extension/Resources/popup
        type: folder
        buildPhase: resources
      - path: Extension/Resources/prepaint
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DuskAppGroupID: $(APP_GROUP_ID)
        DuskReportEmail: $(REPORT_EMAIL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/DuskExtension.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).extension
    preBuildScripts:
      - name: Check extension build
        # Declared input, so user script sandboxing allows the read.
        # content.js is compared with the extension's own build so an archive can't ship an older engine than dist/.
        inputFiles:
          - $(SRCROOT)/Extension/Resources/manifest.json
          - $(SRCROOT)/Extension/Resources/content.js
          - $(SRCROOT)/../extension/dist/content.js
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/Extension/Resources/manifest.json" ]; then
            echo "error: Run apple/scripts/build-extension.sh first"
            exit 1
          fi
          if ! cmp -s "${SRCROOT}/Extension/Resources/content.js" "${SRCROOT}/../extension/dist/content.js"; then
            echo "error: Extension/Resources is older than extension/dist. Run apple/scripts/build-extension.sh"
            exit 1
          fi
    dependencies:
      - package: SettingsKit
  DuskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Dusk
  DuskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dusk
    dependencies:
      - target: Dusk
schemes:
  Dusk:
    build:
      targets:
        Dusk: all
    test:
      targets: [DuskTests, DuskUITests]
      gatherCoverageData: false
