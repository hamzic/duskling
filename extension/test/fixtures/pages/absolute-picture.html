<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Absolutely positioned picture images</title>
<!-- Responsive image cards ("Dim images"): an aspect-ratio box that is the positioned ancestor, holding an
     inline <picture> with a <source> and an <img> stretched over the box with position:absolute and inset 0. The <picture>
     itself generates an empty inline box, so anything that makes it the img's containing block (a filter on it, Filter
     Effects 1 §5) sizes the img to nothing. Also a plain <img> and an <img> directly in a positioned box. -->
<style>
  html, body { margin: 0; background: #ffffff; color: #222222; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { position: relative; width: 100%; aspect-ratio: 16 / 9; margin: 0 0 16px; overflow: hidden; background: #eeeeee; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .plain { display: block; width: 200px; height: 100px; }
</style>
</head>
<body>
<main>
  <h1>Cards</h1>
  <figure class="card" id="card-picture">
    <picture id="pic">
      <source srcset="assets/photo.png" media="(min-width: 1px)">
      <img id="in-picture" src="assets/photo.png" alt="">
    </picture>
  </figure>
  <figure class="card" id="card-img">
    <img id="in-box" src="assets/photo.png" alt="">
  </figure>
  <img class="plain" id="plain" src="assets/photo.png" alt="">
</main>
</body>
</html>
