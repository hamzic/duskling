<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<!-- Declares only a dark scheme and sets no background: the browser paints the dark canvas, so this is the site's own
     dark theme (CSS Color Adjust 1 §2.2) and Duskling uses it. -->
<meta name="color-scheme" content="dark">
<title>Declared dark, dark canvas</title>
<style>
  body { margin: 0; color: #e6e6ea; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 24px; }
</style>
</head>
<body>
<main><h1>Dark by the canvas</h1><p>No background is set; the dark color scheme paints the canvas.</p></main>
</body>
</html>
