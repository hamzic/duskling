<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forms</title>
<!-- Light fixture: native controls with and without author styles. -->
<style>
  html, body { margin: 0; background: #ffffff; color: #222222; font: 16px/1.5 system-ui, sans-serif; }
  form { max-width: 560px; margin: 24px auto; padding: 24px; background: #fbfbfb; border: 1px solid #e3e3e3; border-radius: 8px; }
  label { display: block; margin: 12px 0 4px; color: #333333; }
  .styled { width: 100%; box-sizing: border-box; background: #ffffff; color: #111111; border: 1px solid #c8c8c8; padding: 8px; border-radius: 6px; }
  .styled::placeholder { color: #8a8a8a; }
  fieldset { border: 1px solid #dddddd; margin-top: 16px; }
  legend { color: #444444; }
  .primary { background: #1a73e8; color: #ffffff; border: 0; padding: 10px 18px; border-radius: 6px; }
  .secondary { background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; padding: 10px 18px; border-radius: 6px; }
  .hint { color: #5f6368; font-size: 14px; }
  .error { color: #b3261e; }
</style>
</head>
<body>
<form onsubmit="return false">
  <h1>Sign up</h1>
  <label for="name">Name</label><input id="name" class="styled" placeholder="Jane Doe">
  <label for="mail">Email</label><input id="mail" type="email" class="styled" value="jane@example.invalid">
  <p class="hint">We never share your address.</p>
  <label for="plan">Plan</label>
  <select id="plan" class="styled"><option>Free</option><option>Pro</option></select>
  <label for="bio">Bio</label><textarea id="bio" class="styled" rows="3">Multi-line text</textarea>
  <label for="native">Unstyled input</label><input id="native" placeholder="UA styles only">
  <fieldset><legend>Options</legend>
    <label><input type="checkbox" checked> Newsletter</label>
    <label><input type="radio" name="r" checked> Monthly</label>
    <label><input type="radio" name="r"> Yearly</label>
    <label>Volume <input type="range"></label>
    <label>Progress <progress value="40" max="100"></progress></label>
  </fieldset>
  <p class="error">Error text stays red.</p>
  <p><button class="primary">Create account</button> <button class="secondary" type="button">Cancel</button> <button type="button">UA button</button> <input type="text" disabled value="Disabled"></p>
</form>
</body>
</html>
