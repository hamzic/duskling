<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gradients and shadows</title>
<!-- Light fixture: linear, radial and layered gradients, box and text shadows, colored borders and outlines. -->
<style>
  html, body { margin: 0; background: linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%) fixed; color: #23272f; font: 16px/1.5 system-ui, sans-serif; min-height: 100%; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; }
  .hero { background: radial-gradient(circle at 20% 20%, #ffffff, #eef2f7 70%); padding: 40px 24px; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08); }
  .hero h1 { text-shadow: 0 1px 0 #ffffff; margin: 0; }
  .card { background: linear-gradient(#ffffff, #fafafa); border: 1px solid #e4e7ec; border-top: 3px solid #d0d5dd; box-shadow: 0 1px 2px #e0e0e0, 0 4px 8px rgba(0, 0, 0, 0.05); padding: 16px; margin: 16px 0; border-radius: 10px; }
  .layered { background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.6)), linear-gradient(#f0f4f8, #e6ebf1); padding: 16px; border-radius: 10px; }
  .btn { display: inline-block; background: linear-gradient(#ffffff, #f0f0f0); border: 1px solid #cfcfcf; color: #333333; padding: 8px 16px; border-radius: 6px; box-shadow: inset 0 1px 0 #ffffff, 0 1px 1px rgba(0, 0, 0, 0.1); }
  .ring { outline: 2px solid #c9d7ff; outline-offset: 2px; background: #ffffff; padding: 12px; margin: 16px 0; }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, #d0d0d0, transparent); margin: 24px 0; }
</style>
</head>
<body>
<main>
  <section class="hero"><h1>Soft light surfaces</h1><p>Radial gradient hero with a drop shadow.</p></section>
  <div class="card"><h2>Gradient card</h2><p>Two shadows and a heavier top border.</p><span class="btn">Button</span></div>
  <div class="divider"></div>
  <div class="layered">Layered translucent white over a light gradient.</div>
  <div class="ring">Outlined box.</div>
</main>
</body>
</html>
