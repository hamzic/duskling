<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iframes</title>
<!-- Frames: same-origin document, srcdoc, about:blank written by script, and a cross-origin document from origin B. -->
<style>
  html, body { margin: 0; background: #ffffff; color: #222222; font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  iframe { width: 100%; height: 140px; border: 1px solid #dddddd; }
  h2 { font-size: 15px; margin: 0 0 4px; color: #333333; }
</style>
</head>
<body>
<main>
  <div><h2>Same origin</h2><iframe id="same" src="assets/frame.html"></iframe></div>
  <div><h2>srcdoc</h2><iframe id="srcdoc" srcdoc="<!doctype html><style>body{margin:0;padding:12px;background:#fff;color:#222;font:15px system-ui}</style><p style='background:#f4f4f4;padding:8px'>srcdoc frame</p>"></iframe></div>
  <div><h2>about:blank written by script</h2><iframe id="blank"></iframe></div>
  <div><h2>Cross origin (4101)</h2><iframe id="cross" src="http://localhost:4101/assets/frame.html"></iframe></div>
</main>
<script>
  const d = document.getElementById("blank").contentDocument;
  d.open();
  d.write("<!doctype html><style>body{margin:0;padding:12px;background:#ffffff;color:#222222;font:15px system-ui}</style><p style='background:#f0f0f0;padding:8px'>about:blank frame</p>");
  d.close();
</script>
</body>
</html>
